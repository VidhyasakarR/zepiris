// Kotlin comes from the host app (rootProject.ext.kotlinVersion, 2.0.21 in the
// rider app); the fallback is only for building this module on its own.
buildscript {
    def kotlinVersion = rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.0.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
    namespace 'com.loadshare.lsncapture'
    compileSdkVersion safeExtGet('compileSdkVersion', 35)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.all {
            testLogging {
                events 'passed', 'skipped', 'failed'
            }
        }
    }
}

repositories {
    google()
    mavenCentral()
}

// CameraX (preview + 640x480 analysis + 4:3 photo) and ML Kit face detection
// from Google Play Services (unbundled: the model is delivered by Play Services).
def cameraxVersion = '1.4.2'

dependencies {
    implementation 'com.facebook.react:react-native:+'
    // OkHttp ships with React Native (react-android exposes it as `api`); the host's version wins.
    compileOnly 'com.squareup.okhttp3:okhttp:4.9.2'

    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.core:core-ktx:1.13.1'             // window insets (edge-to-edge)
    implementation 'androidx.exifinterface:exifinterface:1.3.7' // upright photos
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.json:json:20231013' // real org.json for ScoreClient tests (Android's is a stub on the JVM)
}
