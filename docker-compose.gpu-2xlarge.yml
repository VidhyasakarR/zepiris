# 8-vCPU GPU overlay — apply on top of the base + GPU files on a g4dn.2xlarge
# (8 vCPU, same T4 as g4dn.xlarge):
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#                  -f docker-compose.gpu-2xlarge.yml up -d --force-recreate
#
# Why this file exists: on GPU the per-request cost is almost entirely host-side
# (JPEG decode, resize, letterbox, SCRFD anchor decode, NMS) — the T4 itself sits
# near idle. So capacity scales with vCPUs, not with the card.
#
# Measured on g4dn.xlarge (4 vCPU, T4), generator off-box, real prod events:
#   warm (~67% reference-cache hits):  99.5 req/s at p50 114 ms, nothing shed
#                                     115   req/s ceiling (140 offered, 16% shed)
#   cold (every request a cache miss): 74.3 req/s at p50 1042 ms
#
# Fresh traffic costs ~2x because a reference-cache hit skips BOTH the enrolled
# selfie's JPEG decode and its embedding; an all-miss request does two decodes and
# two detect+embed passes instead of roughly 1.3. Doubling the cores is therefore
# the lever that moves the fresh-load number, and 8 vCPU projects to ~148 req/s.
name: zepiris

services:
  ml-inference:
    # 6 workers on 8 vCPU, keeping the same "leave 2 cores for the API and the
    # event loops" ratio the 4-vCPU config uses with 3. Each worker loads its own
    # ~1.4 GB of models onto the card, so 6 is ~8.4 GB of the T4's 15 GB — it
    # fits, but it is the constraint that stops this going higher on a T4.
    # Boot is slower in proportion: every worker warms up before /readyz passes.
    command:
      - python
      - -m
      - uvicorn
      - zepiris.ml_inference.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --workers
      - "6"

  api:
    environment:
      # 3 API workers on 8 vCPU. The API is I/O-bound — it fetches two images and
      # awaits the ML service — so it needs far fewer cores than the ML side.
      ZEPIRIS_API_WORKERS: "3"
      # Unchanged at 40 per worker, now 120 in flight across 3. Sized from the
      # latency promise, not capacity: at a target 150 req/s with ~0.3 s service
      # time a healthy load carries ~45 in flight, so 120 still sheds only when
      # the box is genuinely past what it can serve. Raising this does not add
      # capacity — it converts fast 503s into slow 200s.
      ZEPIRIS_API_LIMIT_CONCURRENCY: "40"
