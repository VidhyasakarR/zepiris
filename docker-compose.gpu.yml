# GPU overlay — apply on top of docker-compose.yml on an NVIDIA instance
# (g4dn.xlarge / T4 and up):
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Requires on the host: NVIDIA driver (nvidia-smi works) and the NVIDIA container
# toolkit (`docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04
# nvidia-smi` works). See docs/CPU_VS_GPU.md §5.
name: zepiris

services:
  ml-inference:
    build:
      args:
        # CUDA 12 / cuDNN 9 build of ONNX Runtime. 1.29+ moved to CUDA 13, which
        # needs a 580-series driver; 1.23.2 runs on the 550/570 drivers the AL2023
        # and Deep Learning AMIs ship. The [cuda,cudnn] extras bring the CUDA
        # libraries as pip wheels, so no CUDA toolkit is needed in the image.
        ONNXRUNTIME_GPU_VERSION: "1.23.2"
        # Pinned with ORT: an unpinned rebuild pulled cuDNN 9.27 and every Conv failed.
        CUDNN_VERSION: "9.8.0.87"
    # Multiple worker processes, because one is not enough — and on GPU the
    # reason is the host, not the card.
    #
    # Measured on g4dn.xlarge (4 vCPU, T4): a single ML process plateaus at ~190%
    # CPU and ~34.5 req/s while the T4 draws 27 W of 70 W. That 190% is the GIL:
    # one core running Python, plus roughly one more from OpenCV and ONNX Runtime
    # releasing it during native work. Per-request cost on GPU is almost all
    # CPU-side — JPEG decode, resize, letterbox, normalize, crop — so the limit is
    # Python throughput, not inference. A bigger instance cannot fix that; one
    # process cannot use more cores. More processes can.
    #
    # 3 on a 4-vCPU host leaves a core for the API and the event loops. Each
    # worker loads its own copy of the models into GPU memory, and each warms up
    # at startup, so boot is slower.
    #
    # Do not raise this on a T4 without capping GPU memory first. Measured in
    # prod 2026-11-23 with the checkpoint models loaded: 3.8-5.8 GB per worker,
    # 14.5 of 15.4 GB in total (not the ~1.4 GB each the face models alone
    # take). ONNX Runtime's CUDA arena keeps what it grows to and nothing caps
    # it, so a 4th worker has nowhere to load.
    command:
      - python
      - -m
      - uvicorn
      - zepiris.ml_inference.app:app
      - --host
      - "0.0.0.0"
      - --port
      - "8001"
      - --workers
      - "3"
    # The NVIDIA container runtime injects the host's driver libraries at startup
    # and rewrites /etc/ld.so.cache to make them findable, which a read-only
    # rootfs refuses. /tmp stays tmpfs, so nothing the service writes persists.
    read_only: false
    environment:
      ML_SERVICE_ML_DEVICE: "cuda"
      # Liveness (MiniFASNet anti-spoof) model. Loads the spoof model alone,
      # without NSFW/blur. Flip together with ZEPIRIS_LIVENESS_ENABLED on the API:
      # with the API flag on and this off, every facematch returns 503.
      ML_SERVICE_LIVENESS_ENABLED: "false"
      # balanced, not accurate: the two tiers share the SAME recognizer
      # (w600k_r50), so match scores and thresholds are unchanged — the only
      # difference is the detector. Measured on a T4: accurate (det_10g @512)
      # capped at 34.5 req/s with the host pinned at 380% CPU, because SCRFD's
      # anchor decoding and NMS run in numpy on the CPU and det_10g emits far
      # more anchors. balanced (det_500m @320) reached 98.9 req/s at p99 273ms on
      # the same box. The detector, not the recognizer, is what sizes a GPU host.
      ML_SERVICE_FACE_TIER: "balanced"
      # A selfie face fills the frame and detects fine at 320; document faces are
      # the case that needs 512+, and this branch is facematch-only.
      ML_SERVICE_FACE_DETECTION_WIDTH: "320"
      ML_SERVICE_FACE_DETECTION_HEIGHT: "320"
      # Per worker, so with 3 workers the instance runs up to 24 inferences at
      # once. This is a queue-depth control, not a throughput knob: on GPU the
      # per-request cost is almost all CPU-side (decode, letterbox, NMS), so an
      # in-flight request is roughly a CPU-active thread, and 4 vCPUs cannot
      # retire more than ~6-8 of those at once — everything past that is
      # queueing *inside* the process, where it inflates every other request's
      # latency through contention. Sizing by Little's law at the target: 150
      # req/s x ~80 ms healthy service time = ~12 in flight; 24 is 2x margin
      # for bursts. The old 12-per-worker (36 total) let a burst put 30+
      # CPU-hungry threads on 4 cores, which is how service time stretched into
      # seconds while the limiter never saw anything worth shedding.
      ML_SERVICE_MAX_CONCURRENT_INFERENCES: "8"
      # 2s to wait for a slot, then 503. This is the promise the service makes
      # about queueing: in a ~100 ms system, a request that has already waited
      # 2s is a lost cause for its caller — serving it late steals capacity
      # from requests that could still be served on time. Measured at 30s, the
      # queue absorbed 200 req/s by answering at up to 27.6s with nothing shed
      # — served, but long after the caller had gone; at 10s the vegeta p99
      # still ran 24s+ because the waiting simply happened before the limiter.
      # Keep the API's own budget (ZEPIRIS_ML_INFERENCE_TIMEOUT_SECONDS, 10s)
      # above this, or the API gives up before the ML service sheds.
      #
      # 1s since 2026-11-23: titan gives up on the checkpoint at 2s, and a
      # checkpoint takes ~0.25s to serve, so a request that has queued 1s can
      # still be answered in time and one that has queued 2s cannot. At 2s the
      # limiter never fired (shed_total 0) while titan timed out 46 calls in
      # one shift-start burst.
      ML_SERVICE_INFERENCE_QUEUE_TIMEOUT_SECONDS: "1"
      # Parallel pair embedding fans one request's two sides across CPU workers.
      # Off here: with 3 GIL-bound worker processes already competing for 4 cores,
      # fanning out inside a request steals throughput from other requests to
      # help one. Worth re-testing once the process count is settled.
      ML_SERVICE_FACE_PARALLEL_PAIR_EMBED: "false"

      # Go-online checkpoint (face + dress colour + logo). On this box the T4 is
      # not the limit for it either: SigLIP2 and the face models run on the GPU
      # in a few ms, but the logo check is PP-OCR (RapidOCR), which is CPU-only.
      # Measured on the 50 latest go-online selfies (2026-10-12): OCR runs only
      # when the shirt is blue (16/50), and then costs ~0.5 s of one M2 core,
      # ~0.75-0.85 s of one of this box's Xeon vCPUs.
      #
      # 1 thread per read: RapidOCR's default spreads ONE read over every core,
      # so three overlapping reads (one per worker) would each fight for all 4
      # vCPUs. 1 read per worker x 3 workers = 3 vCPUs of OCR at most, which
      # leaves one for the API and facematch's CPU-side work. Past that a read
      # waits up to 2s for a slot, then the request gets 503 (retryable), never
      # a logo FAIL: a busy box is not evidence the rider is out of uniform.
      #
      # Expected ceiling with these values: ~3.5-4.5 checkpoint req/s
      # (~210-270/min) if every rider is in a blue shirt, ~10 req/s (~600/min)
      # at the measured 1-in-3 blue mix. Shared with facematch traffic, the
      # two compete for the same 4 vCPUs. If checkpoint volume grows, move it to
      # its own box or a g4dn.2xlarge (8 vCPU) and raise
      # DRESSCODE_LOGO_OCR_MAX_CONCURRENCY to 2.
      #
      # 2026-10-13: OCR moved to the T4 for the <300 ms target. A CPU read
      # (~0.8 s) alone breaks that budget for every blue-shirt rider, at any
      # load. On GPU a read is mostly kernel time, so 2 per worker (6 per box)
      # no longer means 6 busy vCPUs; the semaphore stays as a queue bound.
      # Rollback: set USE_CUDA "false" and MAX_CONCURRENCY back to "1".
      ML_SERVICE_DRESSCODE_LOGO_OCR_USE_CUDA: "true"
      ML_SERVICE_DRESSCODE_LOGO_OCR_THREADS: "1"
      ML_SERVICE_DRESSCODE_LOGO_OCR_MAX_CONCURRENCY: "2"
      # 1s for the same reason as the inference queue: titan is gone at 2s.
      ML_SERVICE_DRESSCODE_LOGO_OCR_QUEUE_TIMEOUT_SECONDS: "1"

      # -----------------------------------------------------------------------
      # Throughput tuning (tasks 1-4 in the optimisation pass)
      # -----------------------------------------------------------------------

      # Downscale ceiling before detection. 1600 is the value the 98.9 req/s and
      # 117 req/s runs were measured at. 640 looked free — the detector letterboxes
      # to 320 anyway — but combined with subsampled decode it cost more than half
      # the throughput (see the decode note above). Left where the measurements are.
      ML_SERVICE_FACE_MAX_INPUT_SIDE: "1600"

      # Reference-embedding cache.  4096 (the default) is enough for a small
      # pilot but will thrash in production with thousands of distinct riders.
      # 16384 entries × 2 KB = ~32 MB — a rounding error against the 1.4 GB
      # model footprint per worker, and it keeps the hit rate above 0.9 once
      # the working set stabilises.
      ML_SERVICE_FACE_REFERENCE_CACHE_SIZE: "16384"

      # libjpeg subsampled decode. OFF (0) — measured a regression, not a win.
      #
      # In theory a half-size DCT costs a quarter of the CPU and 320px detection
      # cannot tell the difference. Measured on this box, reduction=2 together
      # with MAX_INPUT_SIDE=640 took 110 req/s from 107.4 served at p50 113ms
      # down to 71.9 served at p50 1677ms, with latency variance exploding.
      #
      # The likely mechanism is the detector's fallback cascade: cutting pixel
      # area ~4x makes some faces miss on the first pass, and a miss costs a
      # lower-threshold retry plus a 2x upscale retry — each a full extra
      # detection pass. Cheaper pixels are worthless if they turn a one-pass
      # request into a three-pass one.
      #
      # Re-testing it means changing this alone (leave MAX_INPUT_SIDE at 1600),
      # and checking scripts/prod_replay.py for faces that stopped being found —
      # not just the throughput number.
      ML_SERVICE_FACE_JPEG_DECODE_REDUCTION: "0"

      # -----------------------------------------------------------------------
      # FP16 model overrides — DISABLED until convert_fp16.py has been run.
      #
      # On the T4 (8.1 TFLOPS FP32 vs 65 TFLOPS FP16 tensor cores) this is the
      # single largest throughput lever: the GPU switches from CUDA cores to
      # tensor cores and inference cost drops ~2-3×.
      #
      # Step 1 — generate the FP16 models into the mounted model volume. Convert
      # the tier this overlay actually deploys (balanced = buffalo_s detector +
      # buffalo_l recognizer), not the accurate tier's det_10g:
      #   docker run --rm -v zepiris_insightface_cache:/home/appuser/.insightface \
      #     -v ~/zepiris:/src -w /src --entrypoint bash zepiris-ml-inference \
      #     -c "pip install -q onnxconverter-common && python scripts/convert_fp16.py"
      #
      # Step 2 — uncomment the two lines below (they already name the paths the
      # script writes for the balanced tier) and redeploy:
      #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
      #
      # Step 3 — validate before promoting. FP16 rounding near a 0.5 threshold is
      # the only real risk, and prod_replay measures exactly that: |dscore| against
      # the recorded scores, with no verdict allowed to flip.
      #   python scripts/prod_replay.py --base-url http://<host>:8000 --rows 400
      #
      # Paths are under /home/appuser — the container runs as appuser and the
      # volume is mounted on its home, so /root/.insightface does not exist here.
      # A path that does not resolve makes the engine fall back to stock
      # FaceAnalysis with only a warning, so a typo costs accuracy silently.
      # -----------------------------------------------------------------------
      # ML_SERVICE_FACE_DET_MODEL_PATH: "/home/appuser/.insightface/models/buffalo_s/det_500m_fp16.onnx"
      # ML_SERVICE_FACE_REC_MODEL_PATH: "/home/appuser/.insightface/models/buffalo_l/w600k_r50_fp16.onnx"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    environment:
      # Admission control: in-flight requests per worker above which the API
      # answers 503 immediately instead of queueing. ON — this is the only
      # knob that can bound end-to-end latency: the ML service's inference
      # limiter sheds only what reaches its handler, and under overload the
      # queue forms earlier, in the connection backlog, where nothing times
      # out. Measured there twice: 150 req/s offered gave p95 13.9s with ZERO
      # shed, and the on-box vegeta run at 100/s showed p99 24.4s with zero
      # 503s — every slow request was waiting somewhere no limiter could see.
      #
      # Enforced by ASGI middleware counting in-flight REQUESTS
      # (zepiris/api/concurrency.py), not uvicorn's limit_concurrency, which
      # counts idle keep-alive connections — under vegeta's 400 persistent
      # connections (or a fleet of connected phones) that knob sheds a healthy
      # instance at idle, which is what the earlier attempt that "returned
      # 1500 errors with nothing served" actually measured.
      #
      # 6 x 2 workers = 12 in flight. Sized from the caller's deadline, not
      # from capacity: a request admitted behind N others waits about
      # N / throughput. A g4dn.xlarge serves 8 checkpoint req/s (on-box ramp
      # 2026-11-23: p50 276ms at 8/s; p50 2419ms with 70% of calls over 2s at
      # 10/s) and titan gives up at 2s, so 12 in flight is ~1.5s: the last
      # request admitted still lands with 0.5s to spare for the network and
      # titan's own work. Past that the request is already lost to its caller;
      # a fast 503 lets titan skip the rider at once and keeps the box working
      # on calls that can still land. A healthy 8 req/s carries 2-3 in flight.
      #
      # The old 40 (80 in flight) was sized for facematch at ~150 req/s and
      # never fired for checkpoint: shed_total stayed 0 while titan timed out.
      # If /facematch/verify traffic returns at volume (~45 in flight healthy),
      # this needs raising or the two routes need separate limits.
      # Watch it at GET /metrics -> admission.shed_total.
      ZEPIRIS_API_LIMIT_CONCURRENCY: "6"

      # The enrolled selfie's bytes, cached in-process by URL (256 MiB budget,
      # ~800 references). Production reference URLs are content-unique S3 keys,
      # so the same URL cannot start serving different pixels; the 15-min TTL
      # (config default) is the safety valve, not a tuning knob. This removes
      # one of the two S3 GETs per request — and S3's latency tail with it —
      # for every repeat verification, the same traffic shape that gives the ML
      # service's embedding cache its ~2/3 hit rate. Watch it at
      # GET /metrics -> reference_bytes_cache.hit_rate during a load run.
      ZEPIRIS_S3_CACHE_MAX_BYTES: "268435456"
      # 12h, not the 15-min default. Measured in prod 2026-11-23: hit rate 0.416
      # with 11453 expired and 0 evicted, using 43 of 256 MiB. Riders go online
      # once or twice a day, so entries expired long before their next use. 12h
      # covers a morning and an evening shift. Only as safe as the note above:
      # a profile photo overwritten under the same key is served stale for 12h.
      ZEPIRIS_S3_CACHE_TTL_SECONDS: "43200"

      # An S3 GET that has not answered in 5s is not going to make the request:
      # at 10s (the old default) a hung fetch held an admission slot for the
      # full window, and 80 slots x slow-S3 excursions is how a blip upstream
      # turns into shedding healthy requests. S3 GET p99 in-region is far
      # below this; the timeout exists for the pathological connection.
      ZEPIRIS_REFERENCE_FETCH_TIMEOUT_SECONDS: "5"

      # 10s, not the 60s default. The caller (titan's go-online checkpoint) gives up at 2s, so any
      # request still running past that is work nobody will read — it holds an admission slot and an
      # inference slot while the caller has already recorded a failure and alerted. 60s made one
      # slow request cost a minute of capacity during exactly the incident that caused it. Still well
      # above the 2s inference queue timeout below, so the shedding path is unchanged; this only
      # bounds the pathological hang. Titan's 2s read timeout is the number to align to if this ever
      # needs to be exact — application_config zepirisCheckpointVerifyTimeoutMs, default 2000.
      ZEPIRIS_ML_INFERENCE_TIMEOUT_SECONDS: "10"

      # Liveness gate on /facematch/verify (runs concurrently with the match).
      # Requires ML_SERVICE_LIVENESS_ENABLED above. Load-test before enabling:
      # it adds one face detection + MiniFASNet pass per request.
      ZEPIRIS_LIVENESS_ENABLED: "false"
